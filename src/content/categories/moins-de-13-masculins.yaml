# Catégorie du club — collection `categories` (schéma : src/content.config.ts).
# Le nom de ce fichier est l'identifiant stable de la catégorie : c'est lui que
# `matches.teamId` référencera (AD-3). Le renommer casse cette référence.
#
# ⚠️  dataStatus: a-confirmer -> RIEN de ce fichier n'est publié sur le site.
#     En `npm run dev`, un aperçu est affiché avec un bandeau d'avertissement,
#     pour pouvoir tester le parcours « Trouver ma catégorie ».
#
# ÉTAT DES DONNÉES CI-DESSOUS :
#   • trainingSlots — RÉELS, repris des visuels du club (saison 2026-2027).
#   • birthYearFrom / birthYearTo — PROVISOIRES : tranches d'âge usuelles, à
#     faire confirmer par le bureau. Ce sont elles qui résolvent le profil.
#   • licenseFee — PROVISOIRE, valeur d'exemple. À remplacer.
#   • trialAvailable — PROVISOIRE (true). À confirmer catégorie par catégorie.
#   • contact — non renseigné : le parcours affiche alors le contact générique.
#
# POUR PUBLIER : remplacer les valeurs provisoires par les vraies, puis passer
# dataStatus à `confirme`. Le build refuse une fiche confirmée incomplète.

label: "-13 ans garçons"
order: 41
dataStatus: a-confirmer

gender: M
practice: null

birthYearFrom: 2014
birthYearTo: 2015

season: "2026-2027"

trainingSlots:
  - day: mercredi
    startTime: "17:30"
    endTime: "19:00"
    venue: "Gymnase Spinosi (Marsillargues)"
  - day: vendredi
    startTime: "18:30"
    endTime: "20:00"
    venue: "Gymnase Spinosi (Marsillargues)"

licenseFee: 140
trialAvailable: true
contact: null
