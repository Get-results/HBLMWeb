# Catégorie du club — collection `categories` (schéma : src/content.config.ts).
# Le nom de ce fichier est l'identifiant stable de la catégorie : c'est lui que
# `matches.teamId` référencera (AD-3). Le renommer casse cette référence.
#
# DONNÉES OFFICIELLES, transmises par le bureau :
#   • trainingSlots — visuels « Planning d'entraînement », saison 2026-2027.
#   • birthYearFrom / birthYearTo et licenseFee — document « TARIFS SAISON
#     2026-2027 » du 13/09/2026.
#
# À NOTER : il n'existe pas d'équipe -18 masculins cette saison (confirmé par le
# bureau le 13/09/2026). Les garçons nés en 2009-2011 ne résolvent donc aucune
# catégorie et reçoivent le contact du club — c'est voulu, pas un oubli.
#
# EN ATTENTE :
#   • trialAvailable — laissé à `null` volontairement : la disponibilité d'une
#     séance d'essai se voit directement avec le club. Le parcours renvoie donc
#     vers lui. Ne le passer à true/false que si une catégorie a une règle fixe.
#   • contact — pas de référent désigné ; le contact générique prend le relais.

