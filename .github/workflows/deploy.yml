name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Rafraîchissement quotidien des matchs (AD-4). AD-5 impose UN SEUL workflow de
  # build et publication : la tâche planifiée déclenche donc celui-ci plutôt qu'un
  # second workflow qui republierait en parallèle.
  #
  # ⚠️ GitHub Actions n'a PAS de champ `timezone` sur `schedule` — contrairement à
  # ce qu'indique AD-4, qui décrit une fonctionnalité inexistante ici. Le cron est
  # donc en UTC. 03:00 UTC tombe à 04h ou 05h à Paris selon l'heure d'été : ce
  # décalage d'une heure est sans conséquence pour une actualisation nocturne, et
  # c'est un compromis assumé plutôt qu'une approximation cachée.
  schedule:
    - cron: '0 3 * * *'
  # Pour forcer une actualisation sans attendre le cron.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Donne accès au secret MATCHES_API_BASE_URL, porté par l'environnement « api ».
    # Sans cette ligne le secret est simplement absent, et la récupération échoue.
    environment: api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Les matchs sont récupérés AVANT le build : la collection `matches` est
      # produite ici, jamais commitée (AD-4 — remplacement intégral, donnée
      # volatile). Si l'API est injoignable, l'étape échoue et le déploiement
      # n'a pas lieu : le site déjà en ligne reste servi, ce qui vaut mieux
      # qu'une page « aucun match » qui se lirait comme une information.
      - name: Récupérer les matchs
        run: npm run fetch:matches
        env:
          MATCHES_API_BASE_URL: ${{ secrets.MATCHES_API_BASE_URL }}

      # Les valeurs PUBLIC_* sont inlinées dans le HTML au build : elles sont
      # publiques par nature (clé de destination Web3Forms, identifiants Umami).
      # Une variable est donc le bon support — elle reste relisible dans les
      # réglages, alors qu'un secret est masqué jusque dans les logs, ce qui rend
      # tout diagnostic pénible.
      #
      # `vars.X || secrets.X` accepte néanmoins les deux : plusieurs de ces
      # valeurs ont été créées en secrets, et faire échouer le build pour une
      # question de rangement n'aurait servi personne. Une valeur absente vaut ""
      # des deux côtés : le site se construit quand même, avec le repli prévu
      # (bloc de contact, pas de script Umami).
      - name: Build
        run: npm run build
        env:
          PUBLIC_CONTACT_ENDPOINT: ${{ vars.PUBLIC_CONTACT_ENDPOINT || secrets.PUBLIC_CONTACT_ENDPOINT }}
          PUBLIC_CONTACT_ACCESS_KEY: ${{ vars.PUBLIC_CONTACT_ACCESS_KEY || secrets.PUBLIC_CONTACT_ACCESS_KEY }}
          PUBLIC_CONTACT_EMAIL: ${{ vars.PUBLIC_CONTACT_EMAIL || secrets.PUBLIC_CONTACT_EMAIL }}
          PUBLIC_UMAMI_URL: ${{ vars.PUBLIC_UMAMI_URL || secrets.PUBLIC_UMAMI_URL }}
          PUBLIC_UMAMI_ID: ${{ vars.PUBLIC_UMAMI_ID || secrets.PUBLIC_UMAMI_ID }}

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
