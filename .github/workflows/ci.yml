# Vérification des pull requests.
# Le workflow de déploiement ne tourne qu'après un merge sur main : sans ce
# check, une PR qui casse le build ne se découvre qu'une fois fusionnée.
# `npm run build` enchaîne astro build puis `npm run check` : préfixe de base
# (AD-5), liens internes morts, régressions d'accessibilité.
#
# Les garde-fous sont volontairement branchés DANS le job `build` et non dans un
# job à part : `build` est le seul check exigé par la protection de branche, donc
# un job séparé ne bloquerait rien jusqu'à ce que quelqu'un le déclare requis à
# la main — exactement le genre d'oubli qui a laissé passer les défauts que ces
# contrôles existent pour attraper.
name: CI

on:
  pull_request:
    branches: [main]

# Le jeton ne sert qu'au checkout : ce workflow lit le code, le construit, et
# n'écrit nulle part. Sans ce bloc il hérite des permissions par défaut du
# dépôt, qui peuvent être bien plus larges — et une action tierce compromise
# en disposerait. `deploy.yml` déclare déjà les siennes.
permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Les variables PUBLIC_* sont volontairement absentes ici : le build doit
      # passer sans elles. C'est ce qui garantit que le site reste constructible
      # quand une variable manque, avec les replis prévus.
      - name: Build
        run: npm run build
